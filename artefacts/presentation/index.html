<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Precyzyjna rekonstrukcja 3D pomieszczeń na podstawie obrazów z wielu
      kamer RGB
    </title>
    <link rel="stylesheet" href="vendor/reveal/reveal.css" />
    <link rel="stylesheet" href="css/theme.css" />

    <!-- LaTeX rendering (offline, single-file SVG build — no web fonts needed).
         We typeset manually after the slides are fetched and injected. -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["\\(", "\\)"], ["$", "$"]],
          displayMath: [["\\[", "\\]"], ["$$", "$$"]],
        },
        svg: { fontCache: "global", scale: 0.95 },
        startup: { typeset: false },
      };
    </script>
    <script src="vendor/mathjax/tex-svg.js"></script>
  </head>
  <body>
    <div class="reveal">
      <!-- Slides are assembled at load time from individual files in slides/.
           Edit a single slide there; the order below controls the deck. -->
      <div class="slides"></div>
    </div>

    <script src="vendor/reveal/reveal.js"></script>
    <script src="vendor/reveal/notes.js"></script>
    <script>
      // Each entry is one <section> fragment under slides/. Reorder, add or
      // remove lines here to restructure the presentation.
      const SLIDE_FILES = [
        "slides/01-title.html",
        "slides/02-plan.html",
        "slides/03-motivation.html",
        "slides/04-gaussian-splatting.html",
        "slides/05-demo-gsplat.html",
        "slides/06-dynamic-problem.html",
        "slides/07-pipeline.html",
        "slides/08-segmentation.html",
        "slides/09-tracking.html",
        "slides/10-demo-dynamic.html",
        "slides/11-results-efficiency.html",
        "slides/12-hull-snapping.html",
        "slides/13-compression.html",
        "slides/14-results-quality.html",
        "slides/15-conclusions.html",
        "slides/16-thankyou.html",
      ];

      async function loadSlides() {
        const parts = await Promise.all(
          SLIDE_FILES.map(async (file) => {
            const res = await fetch(file);
            if (!res.ok) {
              throw new Error(`Nie udało się wczytać ${file} (${res.status})`);
            }
            return res.text();
          }) 
        );
        document.querySelector(".slides").innerHTML = parts.join("\n");
      }

      async function typesetMath() {
        // Render any LaTeX in the freshly injected slides. Never let a missing
        // or failed MathJax build break the deck.
        try {
          if (window.MathJax && MathJax.startup && MathJax.typesetPromise) {
            await MathJax.startup.promise;
            await MathJax.typesetPromise([document.querySelector(".slides")]);
          }
        } catch (err) {
          console.warn("MathJax typeset skipped:", err);
        }
      }

      loadSlides()
        .then(typesetMath)
        .then(() => {
          Reveal.initialize({
            hash: true,
            width: 1280,
            height: 720,
            margin: 0.045,
            transition: "fade",
            backgroundTransition: "fade",
            slideNumber: "c/t",
            controlsTutorial: false,
            viewDistance: 2,
            preloadIframes: true,
            plugins: [RevealNotes],
          });
        })
        .catch((err) => {
          document.querySelector(".slides").innerHTML =
            `<section><h2>Błąd wczytywania slajdów</h2><p>${err.message}</p>` +
            `<p class="dim">Uruchom przez ./start.sh — slajdy są wczytywane przez HTTP.</p></section>`;
          Reveal.initialize({ plugins: [RevealNotes] });
        });
    </script>
  </body>
</html>
