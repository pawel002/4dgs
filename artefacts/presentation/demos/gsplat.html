<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Live 3D Gaussian Splatting</title>
    <link rel="stylesheet" href="demo.css" />
    <style>
      /* The WebGL canvas clears to transparent, so the light page shows through */
      html,
      body {
        background: #f5f7fa;
      }
      #canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #spinner {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 4px solid rgba(15, 23, 42, 0.12);
        border-top-color: #0d9488;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }

      #progress-wrap {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 3px;
        background: rgba(15, 23, 42, 0.08);
      }
      #progress {
        height: 100%;
        width: 0;
        background: #0d9488;
        transition: width 0.2s;
      }

      #message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #dc2626;
        font-size: 14px;
        text-align: center;
        max-width: 80%;
        font-family: -apple-system, "Segoe UI", sans-serif;
      }

      .stat-pill {
        position: absolute;
        top: 12px;
        right: 14px;
        display: flex;
        gap: 14px;
        align-items: center;
        color: #334155;
        font-size: 12px;
        background: rgba(255, 255, 255, 0.78);
        padding: 5px 12px;
        border-radius: 8px;
        border: 1px solid rgba(15, 23, 42, 0.1);
        font-variant-numeric: tabular-nums;
      }
      .stat-pill #fps {
        color: #0d9488;
        font-weight: 600;
      }
      .stat-pill #camid {
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="spinner"></div>
    <div id="message"></div>
    <div id="progress-wrap"><div id="progress"></div></div>

    <div class="tag">
      Rasteryzer 3D Gaussian Splatting (WebGL2) — wytrenowana scena
    </div>
    <div class="stat-pill"><span id="camid"></span><span id="fps">…</span></div>
    <script src="../vendor/gsplat/main.js"></script>
  </body>
</html>
